<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bingo Musical — Mis XV Sofi</title>
    <link rel="icon" type="image/jpeg" href="assets/img/hero.jpg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playball&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/acuarela.css" />
    <link rel="stylesheet" href="assets/css/bingo.css" />
  </head>
  <body>
    <img class="bingo-deco tl" src="assets/img/acuarela-1.jpg" alt="" />
    <img class="bingo-deco br" src="assets/img/acuarela-1.jpg" alt="" />
    <div class="bingo-wrap">
      <p class="eyebrow">Mis XV · Sofi</p>
      <h1 class="script">Bingo Musical</h1>
      <p class="bingo-card-id" id="cardIdLabel">Cartón N.º —</p>
      <div class="bingo-grid" id="grid"></div>
      <p class="bingo-rules">
        Marcá el casillero cuando suene tu canción.<br />¡Bingo al completar
        una fila o columna!
      </p>
      <button class="bingo-reset" id="resetBtn">Reiniciar cartón</button>
    </div>

    <div class="bingo-banner" id="bingoBanner">
      <h2 class="script">¡Bingo!</h2>
      <p>Avisale a la organización para confirmar tu premio.</p>
      <button id="closeBanner">Seguir jugando</button>
    </div>

    <script src="assets/js/bingo-songs.js"></script>
    <script src="assets/js/bingo-core.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      let cardId = parseInt(params.get("c"), 10);
      if (!cardId) {
        cardId = parseInt(localStorage.getItem("bingo-card-id"), 10);
      }
      if (!cardId) {
        cardId = Math.floor(Math.random() * 10000000) + 1;
      }
      localStorage.setItem("bingo-card-id", cardId);
      const url = new URL(location.href);
      url.searchParams.set("c", cardId);
      history.replaceState(null, "", url);

      document.getElementById("cardIdLabel").textContent =
        "Cartón N.º " + String(cardId).padStart(3, "0");

      const songs = bingoCardSongs(cardId, BINGO_SONGS);
      const marksKey = "bingo-marks-" + cardId;
      let marks = JSON.parse(localStorage.getItem(marksKey) || "[]");
      if (marks.length !== 16) marks = new Array(16).fill(false);

      const grid = document.getElementById("grid");
      const banner = document.getElementById("bingoBanner");
      let bingoShown = false;

      function checkWin() {
        let winCells = new Set();
        let won = false;
        for (const line of bingoLines()) {
          if (line.every((i) => marks[i])) {
            won = true;
            line.forEach((i) => winCells.add(i));
          }
        }
        document.querySelectorAll(".bingo-cell").forEach((el, i) => {
          el.classList.toggle("win", winCells.has(i));
        });
        if (won && !bingoShown) {
          bingoShown = true;
          banner.classList.add("show");
        }
      }

      function render() {
        grid.innerHTML = "";
        songs.forEach((s, i) => {
          const cell = document.createElement("div");
          cell.className = "bingo-cell" + (marks[i] ? " marked" : "");
          cell.innerHTML = "<span>" + s + "</span>";
          cell.addEventListener("click", () => {
            marks[i] = !marks[i];
            localStorage.setItem(marksKey, JSON.stringify(marks));
            render();
          });
          grid.appendChild(cell);
        });
        checkWin();
      }

      document.getElementById("resetBtn").addEventListener("click", () => {
        marks = new Array(16).fill(false);
        localStorage.setItem(marksKey, JSON.stringify(marks));
        bingoShown = false;
        banner.classList.remove("show");
        render();
      });
      document.getElementById("closeBanner").addEventListener("click", () => {
        banner.classList.remove("show");
      });

      render();
    </script>
  </body>
</html>
