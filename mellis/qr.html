<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Álbum de fotos — Escaneá para subir</title>
    <link rel="icon" type="image/jpeg" href="assets/img/bolas.jpg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playball&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f3f5;
        --texto: #2a2a2e;
        --acento: #83838c;
        --flor: #c9c9cf;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: 'Cormorant Garamond', serif;
        background: var(--bg);
        color: var(--texto);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .deco {
        position: absolute;
        width: 34vh;
        height: 34vh;
        object-fit: cover;
        opacity: 0.35;
        pointer-events: none;
      }
      .deco.tl {
        top: 0;
        left: 0;
        -webkit-mask-image: radial-gradient(circle at 0% 0%, black 20%, transparent 58%);
        mask-image: radial-gradient(circle at 0% 0%, black 20%, transparent 58%);
      }
      .deco.br {
        bottom: 0;
        right: 0;
        -webkit-mask-image: radial-gradient(circle at 100% 100%, black 20%, transparent 58%);
        mask-image: radial-gradient(circle at 100% 100%, black 20%, transparent 58%);
      }

      .stage {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7vw;
        padding: 4vh 6vw;
        flex-wrap: wrap;
        text-align: center;
      }

      .info { text-align: center; }
      .eyebrow {
        font-size: 2.6vh;
        letter-spacing: 0.6vh;
        text-transform: uppercase;
        color: var(--acento);
        margin: 0 0 1vh;
      }
      h1.script {
        font-family: 'Playball', cursive;
        font-weight: normal;
        font-size: 9vh;
        line-height: 1;
        margin: 0 0 1.5vh;
        color: var(--texto);
      }
      .subtitle {
        font-size: 3.2vh;
        margin: 0 0 3vh;
        color: var(--texto);
      }

      .qr-card {
        background: #fff;
        border: 2px solid var(--acento);
        border-radius: 3vh;
        padding: 3.2vh;
        box-shadow: 0 1.5vh 4vh rgba(42, 42, 46, 0.18);
        animation: pulse 2.6s ease-in-out infinite;
      }
      .qr-card svg {
        display: block;
        width: 38vh;
        height: 38vh;
      }
      @keyframes pulse {
        0%, 100% {
          box-shadow: 0 1.5vh 4vh rgba(42, 42, 46, 0.18), 0 0 0 0 rgba(131, 131, 140, 0.35);
        }
        50% {
          box-shadow: 0 1.5vh 4vh rgba(42, 42, 46, 0.18), 0 0 0 1.4vh rgba(131, 131, 140, 0);
        }
      }

      @media (max-aspect-ratio: 1/1) {
        h1.script { font-size: 7vh; }
        .qr-card svg { width: 32vh; height: 32vh; }
      }
    </style>
  </head>
  <body>
    <img class="deco tl" src="assets/img/bolas.jpg" alt="" />
    <img class="deco br" src="assets/img/bolas.jpg" alt="" />

    <div class="stage">
      <div class="info">
        <p class="eyebrow">Cami y Fran · Nuestros XV</p>
        <h1 class="script">Álbum de fotos</h1>
        <p class="subtitle">Escaneá y subí tus fotos del festejo</p>
      </div>

      </div>
    </div>
  </body>
</html>
