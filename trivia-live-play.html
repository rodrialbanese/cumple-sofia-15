<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>¿Quién la conoce mejor? EN VIVO — Mis XV Sofi</title>
    <link rel="icon" type="image/jpeg" href="assets/img/hero.jpg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playball&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/acuarela.css" />
    <link rel="stylesheet" href="assets/css/trivia-live.css" />
  </head>
  <body>
    <img class="live-deco tl" src="assets/img/acuarela-1.jpg" alt="" />
    <img class="live-deco br" src="assets/img/acuarela-1.jpg" alt="" />

    <div class="player-wrap">
      <p class="eyebrow">Mis XV · Sofi</p>
      <h1 class="script">¿Quién la conoce mejor?</h1>
      <p class="player-status" id="playerStatus" hidden></p>
      <div id="app"></div>
    </div>

    <script src="assets/js/trivia-data.js"></script>
    <script src="assets/js/trivia-live-core.js"></script>
    <script>
      const API_DEFAULT =
        "https://script.google.com/macros/s/AKfycbzCWUdOuYgn1fZifMfDjQ7Ui2t1BI9hthLSt4muJFJd3O9mDNNBYm__ECw2RqiCVxps/exec";
      const API = new URLSearchParams(location.search).get("api") || API_DEFAULT;

      const QUESTIONS = buildLiveQuestions();
      const app = document.getElementById("app");

      // Guardamos nombre y última respuesta en localStorage, con manejo de
      // errores: si por lo que sea falla (cuota llena, modo privado,
      // bloqueado por el navegador), no queremos que reviente el resto de
      // la página — seguimos sin persistencia en vez de romper todo.
      function safeGet(key) {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          return null;
        }
      }
      function safeSet(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (e) {
          // sin persistencia esta vez, no pasa nada.
        }
      }
      function safeRemove(key) {
        try {
          localStorage.removeItem(key);
        } catch (e) {}
      }

      let playerName = safeGet("trivia-live-name") || "";
      let joinedGameId = null;
      // Lo último que contestamos, para no repetir mientras esperamos el reveal.
      let answered = JSON.parse(safeGet("trivia-live-answered") || "null");

      function saveAnswered(a) {
        answered = a;
        safeSet("trivia-live-answered", JSON.stringify(a));
      }

      function updateStatusBar() {
        const statusEl = document.getElementById("playerStatus");
        if (!playerName) {
          statusEl.hidden = true;
          statusEl.innerHTML = "";
          return;
        }
        statusEl.hidden = false;
        statusEl.innerHTML =
          "Jugando como <strong>" + playerName + "</strong> " +
          '<button type="button" id="changeNameBtn">Cambiar nombre</button>';
        document.getElementById("changeNameBtn").addEventListener("click", function () {
          playerName = "";
          joinedGameId = null;
          answered = null;
          safeRemove("trivia-live-name");
          safeRemove("trivia-live-answered");
          updateStatusBar();
          renderJoinForm();
        });
      }

      function renderJoinForm() {
        app.innerHTML =
          '<div class="player-name-field">' +
          '<label for="nameInput">Tu nombre</label>' +
          '<input type="text" id="nameInput" placeholder="Escribí tu nombre" />' +
          "</div>" +
          '<button class="player-btn" id="joinBtn">Unirme al juego</button>';
        document.getElementById("joinBtn").addEventListener("click", function () {
          const val = document.getElementById("nameInput").value.trim();
          if (!val) return;
          playerName = val;
          safeSet("trivia-live-name", playerName);
          updateStatusBar();
          renderWaiting();
        });
      }

      function renderWaiting(msg) {
        app.innerHTML = '<p class="player-waiting">' + (msg || "Ya estás adentro.<br>Esperando que arranque el juego…") + "</p>";
      }

      function ensureJoined(gameId) {
        if (joinedGameId === gameId) return;
        joinedGameId = gameId;
        livePost(API, { tipo: "live-join", gameId: gameId, nombre: playerName });
      }

      function renderQuestion(state, q) {
        const cols = q.options.length === 4 ? "" : " two";
        app.innerHTML =
          '<p class="player-question">' + q.question + "</p>" +
          '<div class="player-options">' +
          q.options
            .map(function (opt, i) {
              const style = LIVE_OPTION_STYLES[i];
              return (
                '<button class="player-option" style="background:' + style.bg + '" data-i="' + i + '">' +
                '<span class="shape">' + style.shape + "</span>" + opt +
                "</button>"
              );
            })
            .join("") +
          "</div>";
        Array.prototype.forEach.call(document.querySelectorAll(".player-option"), function (btn) {
          btn.addEventListener("click", function () {
            const i = parseInt(btn.getAttribute("data-i"), 10);
            submitAnswer(state, q, i);
          });
        });
      }

      function submitAnswer(state, q, pickedIndex) {
        Array.prototype.forEach.call(document.querySelectorAll(".player-option"), function (btn) {
          btn.disabled = true;
        });
        const elapsed = Date.now() - state.startedAt;
        const correct = pickedIndex === q.correctIndex;
        const points = liveComputePoints(correct, elapsed);
        saveAnswered({
          gameId: state.gameId,
          questionIndex: state.questionIndex,
          pickedIndex: pickedIndex,
          correct: correct,
          points: points,
        });
        livePost(API, {
          tipo: "live-answer",
          gameId: state.gameId,
          questionIndex: state.questionIndex,
          nombre: playerName,
          respuestaIndex: pickedIndex,
          correcta: correct,
          puntos: points,
        });
        renderWaiting("¡Enviado!<br>Esperando a los demás…");
      }

      function renderReveal(state, q) {
        const hasAnswered = answered && answered.gameId === state.gameId && answered.questionIndex === state.questionIndex;
        const correct = hasAnswered && answered.correct;
        const points = hasAnswered ? answered.points : 0;

        app.innerHTML =
          '<p class="player-reveal-icon ' + (correct ? "ok" : "no") + '">' + (correct ? "✓" : "✗") + "</p>" +
          '<p class="player-reveal-points">+' + points + "</p>" +
          '<p class="player-reveal-total" id="revealTotal">Calculando puntaje total…</p>';

        liveJsonp(API + "?action=live-leaderboard").then(function (data) {
          const entries = data.entries || [];
          const idx = entries.findIndex(function (e) { return e.nombre === playerName; });
          const total = idx >= 0 ? entries[idx].puntos : 0;
          const rank = idx >= 0 ? idx + 1 : "-";
          const totalEl = document.getElementById("revealTotal");
          if (totalEl) {
            totalEl.textContent = "Puntaje total: " + total + " · Puesto N.º " + rank;
          }
        });
      }

      function renderFinished() {
        app.innerHTML = '<p class="player-waiting" id="finalMsg">Calculando resultado final…</p>';
        liveJsonp(API + "?action=live-leaderboard").then(function (data) {
          const entries = data.entries || [];
          const idx = entries.findIndex(function (e) { return e.nombre === playerName; });
          const el = document.getElementById("finalMsg");
          if (!el) return;
          if (idx === 0) {
            el.innerHTML = "🏆 ¡Ganaste!<br>" + entries[0].puntos + " puntos";
          } else if (idx >= 0) {
            el.innerHTML = "Terminaste en el puesto N.º " + (idx + 1) + "<br>" + entries[idx].puntos + " puntos";
          } else {
            el.innerHTML = "¡Juego terminado!";
          }
        });
      }

      // tick() corre cada 1.8s mientras dure cualquier fase — sin esto,
      // "reveal" y "finished" se volvían a dibujar (y a pedir el ranking
      // de nuevo) en cada ciclo, reiniciando el "Calculando..." antes de
      // que llegara la respuesta anterior. Solo renderizamos una vez por
      // pregunta/partida; los ciclos siguientes no hacen nada si ya
      // mostramos esa misma pantalla.
      let lastRenderedKey = null;

      function tick() {
        if (!playerName) return; // todavía no se unió
        liveJsonp(API + "?action=live-state").then(function (state) {
          ensureJoined(state.gameId);

          if (state.phase === "idle" || state.phase === "lobby") {
            renderWaiting();
            return;
          }

          const q = QUESTIONS[state.questionIndex];
          const hasAnsweredThis = answered && answered.gameId === state.gameId && answered.questionIndex === state.questionIndex;

          if (state.phase === "question") {
            if (hasAnsweredThis) {
              renderWaiting("¡Enviado!<br>Esperando a los demás…");
            } else {
              const key = "question:" + state.gameId + ":" + state.questionIndex;
              if (lastRenderedKey !== key) {
                lastRenderedKey = key;
                renderQuestion(state, q);
              }
            }
          } else if (state.phase === "reveal") {
            const key = "reveal:" + state.gameId + ":" + state.questionIndex;
            if (lastRenderedKey !== key) {
              lastRenderedKey = key;
              renderReveal(state, q);
            }
          } else if (state.phase === "finished") {
            const key = "finished:" + state.gameId;
            if (lastRenderedKey !== key) {
              lastRenderedKey = key;
              renderFinished();
            }
          }
        });
      }

      if (!playerName) {
        renderJoinForm();
      } else {
        updateStatusBar();
        renderWaiting();
      }
      tick();
      setInterval(tick, 900);
    </script>
  </body>
</html>
