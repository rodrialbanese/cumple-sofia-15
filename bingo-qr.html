<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bingo Musical — Escaneá para jugar</title>
    <link rel="icon" type="image/jpeg" href="assets/img/hero.jpg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playball&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/acuarela.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .deco {
        position: absolute;
        width: 34vh;
        height: 34vh;
        object-fit: cover;
        opacity: 0.4;
        pointer-events: none;
      }
      .deco.tl {
        top: 0;
        left: 0;
        -webkit-mask-image: radial-gradient(
          circle at 0% 0%,
          black 20%,
          transparent 58%
        );
        mask-image: radial-gradient(circle at 0% 0%, black 20%, transparent 58%);
      }
      .deco.br {
        bottom: 0;
        right: 0;
        -webkit-mask-image: radial-gradient(
          circle at 100% 100%,
          black 20%,
          transparent 58%
        );
        mask-image: radial-gradient(
          circle at 100% 100%,
          black 20%,
          transparent 58%
        );
      }

      .stage {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7vw;
        padding: 4vh 6vw;
        flex-wrap: wrap;
        text-align: center;
      }

      .info {
        text-align: center;
      }
      .eyebrow {
        font-size: 2.6vh;
        letter-spacing: 0.6vh;
        text-transform: uppercase;
        color: var(--acento);
        margin: 0 0 1vh;
      }
      h1.script {
        font-size: 11vh;
        line-height: 1;
        margin: 0 0 1.5vh;
        color: var(--texto);
      }
      .subtitle {
        font-size: 3.2vh;
        margin: 0 0 3vh;
        color: var(--texto);
      }
      .flor {
        width: 9vh;
      }

      .qr-card {
        background: #fff;
        border: 2px solid var(--acento);
        border-radius: 3vh;
        padding: 3.2vh;
        box-shadow: 0 1.5vh 4vh rgba(61, 74, 58, 0.18);
        animation: pulse 2.6s ease-in-out infinite;
      }
      .qr-card svg {
        display: block;
        width: 38vh;
        height: 38vh;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 1.5vh 4vh rgba(61, 74, 58, 0.18),
            0 0 0 0 rgba(111, 138, 104, 0.35);
        }
        50% {
          box-shadow: 0 1.5vh 4vh rgba(61, 74, 58, 0.18),
            0 0 0 1.4vh rgba(111, 138, 104, 0);
        }
      }

      .link {
        margin-top: 2vh;
        font-size: 2.4vh;
        letter-spacing: 0.05vh;
        color: var(--acento);
      }

      @media (max-aspect-ratio: 1/1) {
        h1.script {
          font-size: 8vh;
        }
        .qr-card svg {
          width: 32vh;
          height: 32vh;
        }
      }
    </style>
  </head>
  <body>
    <img class="deco tl" src="assets/img/acuarela-1.jpg" alt="" />
    <img class="deco br" src="assets/img/acuarela-1.jpg" alt="" />

    <div class="stage">
      <div class="info">
        <p class="eyebrow">Mis XV · Sofi</p>
        <h1 class="script">Bingo Musical</h1>
        <p class="subtitle">Escaneá y jugá desde tu celular</p>
        <img
          class="flor"
          src="assets/img/flor.png"
          alt=""
        />
      </div>

      <div>
        <div class="qr-card">

        </div>
        <p class="link">cumple-sofia-15.vercel.app/bingo.html</p>
      </div>
    </div>
  </body>
</html>
